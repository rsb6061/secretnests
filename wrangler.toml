name = "secretnests"
main = "src/index.js"
compatibility_date = "2026-09-24"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "secretnests"
database_id = "5dd51f5f-d969-4563-a893-963e3d3a6962"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "secretnests-assets"

[vars]
APP_ORIGIN = "https://secretnests.com"
SUBMISSIONS_ENABLED = "true"
AUTH_MODE = "auth0"
VERIFICATION_UPLOADS_ENABLED = "false"
MARKET_INTELLIGENCE_MODE = "pilot"
NUITEE_TOP250_AUDIT_ENABLED = "true"
EXTERNAL_EVIDENCE_MODEL = "gpt-5.6-luna"
WORKERS_AI_EVIDENCE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
WORKERS_AI_CONTRIBUTION_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AUTH0_CONNECTION = "google-oauth2"
RATE_BOOKER_COUNTRY = "us"
RATE_CURRENCY = "USD"

[[routes]]
pattern = "secretnests.com/*"
zone_name = "secretnests.com"

[[routes]]
pattern = "www.secretnests.com/*"
zone_name = "secretnests.com"

[ai]
binding = "AI"

[observability]
enabled = true



[triggers]
crons = ["17 * * * *", "23 5 * * *", "7,22,37,52 * * * *"]
