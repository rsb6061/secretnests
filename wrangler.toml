name = "secretnests"
main = "src/index.js"
compatibility_date = "2026-09-24"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "secretnests"
database_id = "5dd51f5f-d969-4563-a893-963e3d3a6962"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "secretnests-assets"

[vars]
APP_ORIGIN = "https://secretnests.com"
SUBMISSIONS_ENABLED = "false"
AUTH_MODE = "disabled"
VERIFICATION_UPLOADS_ENABLED = "false"

[observability]
enabled = true


