<!doctype html><meta charset="utf-8"><title>SecretNests bootstrap</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px}button{padding:12px 18px;font-size:16px}pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:8px}</style>
<h1>SecretNests database bootstrap</h1>
<p>This one-time tool loads the production D1 database from the migrated GitHub dataset.</p>
<button id="run">Run bootstrap</button>
<pre id="log">Ready.</pre>
<script>
const log=document.getElementById('log');
const run=async(path)=>{const r=await fetch('/__bootstrap/'+path);const t=await r.text();log.textContent+='\n'+path+': '+t;if(!r.ok)throw new Error(path+' failed');return JSON.parse(t)};
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;log.textContent='Starting…';
 try{
   await run('schema');
   for(let i=0;i<27;i++) await run('hotels-'+i);
   for(let i=0;i<3;i++) await run('reddit-'+i);
   const v=await run('verify');
   log.textContent+='\n\nDONE: '+JSON.stringify(v);
 }catch(e){log.textContent+='\n\nERROR: '+e.message;document.getElementById('run').disabled=false}
};
</script>
