name: Deploy SecretNests

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        type: choice
        options:
          - deploy
          - migrate-db
          - seed-legacy-hotels

permissions:
  contents: read

concurrency:
  group: secretnests-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

      - name: Apply D1 migrations
        if: inputs.action == 'migrate-db'
        run: npx wrangler d1 migrations apply secretnests --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build legacy hotel seed
        if: inputs.action == 'seed-legacy-hotels'
        run: node scripts/build-legacy-hotel-seed.mjs

      - name: Seed legacy hotels
        if: inputs.action == 'seed-legacy-hotels'
        run: npx wrangler d1 execute secretnests --remote --file=.generated/legacy-hotels.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Dry run Worker
        if: inputs.action == 'deploy'
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Deploy Worker
        if: inputs.action == 'deploy'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
