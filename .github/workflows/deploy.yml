name: SecretNests Cloudflare

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        type: choice
        options:
          - bootstrap
          - deploy
          - migrate-db
          - seed-legacy-hotels
          - seed-reddit-evidence
          - seed-demo

permissions:
  contents: read

concurrency:
  group: secretnests-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run check

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail

          LIST="$(curl -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"

          DB_ID="$(echo "$LIST" | jq -r '.result[] | select(.name=="secretnests") | .uuid' | head -n1)"

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating D1 database secretnests..."
            CREATED="$(curl -fsS -X POST               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"secretnests"}'               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"

            echo "$CREATED" | jq -e '.success == true' >/dev/null
            DB_ID="$(echo "$CREATED" | jq -r '.result.uuid')"
          else
            echo "D1 database already exists."
          fi

          test -n "$DB_ID"
          test "$DB_ID" != "null"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

          # Never commit an environment-specific UUID. Patch the checked-out
          # config only for this Actions run.
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/g" wrangler.toml

      - name: Find or create R2 bucket
        if: inputs.action == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list | grep -q "secretnests-media"; then
            echo "R2 bucket secretnests-media already exists."
          else
            echo "Creating R2 bucket secretnests-media..."
            npx wrangler r2 bucket create secretnests-media
          fi

      - name: Apply D1 migrations
        if: inputs.action == 'bootstrap' || inputs.action == 'migrate-db'
        run: npx wrangler d1 migrations apply secretnests --remote --yes

      - name: Build legacy hotel seed
        if: inputs.action == 'bootstrap' || inputs.action == 'seed-legacy-hotels'
        run: node scripts/build-legacy-hotel-seed.mjs

      - name: Seed legacy hotels
        if: inputs.action == 'bootstrap' || inputs.action == 'seed-legacy-hotels'
        run: npx wrangler d1 execute secretnests --remote --file=.generated/legacy-hotels.sql --yes

      - name: Build Reddit evidence seed
        if: inputs.action == 'bootstrap' || inputs.action == 'seed-reddit-evidence'
        run: node scripts/build-reddit-evidence-seed.mjs

      - name: Seed Reddit evidence
        if: inputs.action == 'bootstrap' || inputs.action == 'seed-reddit-evidence'
        run: npx wrangler d1 execute secretnests --remote --file=.generated/reddit-evidence.sql --yes

      - name: Build demo creator seed
        if: inputs.action == 'bootstrap' || inputs.action == 'seed-demo'
        run: node scripts/build-demo-seed.mjs

      - name: Seed demo creator
        if: inputs.action == 'bootstrap' || inputs.action == 'seed-demo'
        run: npx wrangler d1 execute secretnests --remote --file=.generated/demo.sql --yes

      - name: Dry-run Worker
        if: inputs.action == 'bootstrap' || inputs.action == 'deploy'
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Deploy Worker
        if: inputs.action == 'bootstrap' || inputs.action == 'deploy'
        run: npx wrangler deploy

      - name: Bootstrap summary
        if: inputs.action == 'bootstrap'
        run: |
          echo "SecretNests Cloudflare bootstrap complete."
          echo "D1 database: secretnests"
          echo "D1 database id: ${{ steps.d1.outputs.database_id }}"
          echo "R2 bucket: secretnests-media"
          echo "Worker: secretnests"
