name: SecretNests Cloudflare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretnests-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run check

      - name: Resolve Cloudflare account from API token
        id: account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          WHOAMI="$(npx wrangler whoami --json)"
          echo "$WHOAMI" | jq -e '.loggedIn == true' >/dev/null
          ACCOUNT_COUNT="$(echo "$WHOAMI" | jq '.accounts | length')"
          if [ "$ACCOUNT_COUNT" -ne 1 ]; then
            echo "::error::Cloudflare API token must resolve to exactly one scoped account; found $ACCOUNT_COUNT."
            echo "$WHOAMI" | jq '{loggedIn,authType,accounts:[.accounts[]|{name}]}'
            exit 1
          fi
          ACCOUNT_ID="$(echo "$WHOAMI" | jq -r '.accounts[0].id')"
          ACCOUNT_NAME="$(echo "$WHOAMI" | jq -r '.accounts[0].name')"
          test -n "$ACCOUNT_ID"
          test "$ACCOUNT_ID" != "null"
          echo "Resolved Cloudflare account: $ACCOUNT_NAME"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(curl --connect-timeout 5 --max-time 30 -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          DB_ID="$(echo "$LIST" | jq -r '.result[] | select(.name=="secretnests") | .uuid' | head -n1)"
          test -n "$DB_ID"
          test "$DB_ID" != "null"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          sed -i -E 's/database_id = "[^"]+"/database_id = "'"$DB_ID"'"/' wrangler.toml

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply secretnests --remote

      - name: Verify market-intelligence schema
        run: |
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(*) AS mappings FROM hotel_provider_mappings; SELECT COUNT(*) AS evidence FROM hotel_external_evidence; SELECT COUNT(*) AS rate_runs FROM hotel_rate_sync_runs; SELECT COUNT(*) AS evidence_runs FROM hotel_evidence_sync_runs;" --yes

      - name: Dry-run Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync optional market-intelligence secrets
        shell: bash
        env:
          BOOKING_DEMAND_API_TOKEN: ${{ secrets.BOOKING_DEMAND_API_TOKEN }}
          BOOKING_DEMAND_AFFILIATE_ID: ${{ secrets.BOOKING_DEMAND_AFFILIATE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          configured=0
          if [ -n "$BOOKING_DEMAND_API_TOKEN" ]; then
            printf '%s' "$BOOKING_DEMAND_API_TOKEN" | npx wrangler secret put BOOKING_DEMAND_API_TOKEN
            configured=$((configured+1))
          else
            echo "::notice::BOOKING_DEMAND_API_TOKEN is not configured in GitHub Actions."
          fi
          if [ -n "$BOOKING_DEMAND_AFFILIATE_ID" ]; then
            printf '%s' "$BOOKING_DEMAND_AFFILIATE_ID" | npx wrangler secret put BOOKING_DEMAND_AFFILIATE_ID
            configured=$((configured+1))
          else
            echo "::notice::BOOKING_DEMAND_AFFILIATE_ID is not configured in GitHub Actions."
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
            configured=$((configured+1))
          else
            echo "::notice::OPENAI_API_KEY is not configured in GitHub Actions."
          fi
          echo "Synced $configured of 3 optional market-intelligence secrets."
          npx wrangler secret list || true

      - name: Create one-time pilot activation token
        id: pilot
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx wrangler secret put PRODUCTION_ACTIVATION_TOKEN
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/health | jq -e '.ok == true'
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/ >/dev/null

      - name: Run bounded market-intelligence pilot
        id: pilot_run
        shell: bash
        env:
          PILOT_TOKEN: ${{ steps.pilot.outputs.token }}
        run: |
          set -euo pipefail
          RESULT="$(curl --connect-timeout 5 --max-time 120 -fsS -X POST \
            -H "Authorization: Bearer $PILOT_TOKEN" \
            https://secretnests.com/api/internal/market-intelligence/pilot)"
          echo "$RESULT" | jq .
          echo "$RESULT" | jq -e '.ok == true'
          echo "result=$(echo "$RESULT" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Inspect pilot quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Booking provider mappings ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT h.name,m.provider_hotel_id,m.confidence,json_extract(m.metadata_json,'$.matched_name') AS matched_name,ROUND(CAST(json_extract(m.metadata_json,'$.distance_km') AS REAL),3) AS distance_km FROM hotel_provider_mappings m JOIN hotels h ON h.id=m.hotel_id WHERE m.provider='booking_demand' ORDER BY m.updated_at DESC LIMIT 10;" --yes
          echo "=== Recent live rates ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT h.name,ROUND(r.nightly_rate,2) AS nightly_rate,r.currency,r.checkin_date,r.checkout_date,r.room_type,r.taxes_fees_included,r.observed_at FROM hotel_rate_observations r JOIN hotels h ON h.id=r.hotel_id WHERE r.provider_id='booking_demand' ORDER BY r.observed_at DESC LIMIT 20;" --yes
          echo "=== Recent external evidence ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT h.name,e.source_domain,e.sentiment,e.confidence,substr(e.summary,1,180) AS summary,e.observed_at FROM hotel_external_evidence e JOIN hotels h ON h.id=e.hotel_id ORDER BY e.observed_at DESC LIMIT 20;" --yes

      - name: Release summary
        if: always()
        run: |
          echo "D1 database: secretnests"
          echo "Worker: secretnests"
          echo "Market intelligence mode: pilot (top 10 only)"
