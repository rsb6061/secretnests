name: SecretNests Cloudflare Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      run_market_pilot:
        description: "Run the market-intelligence pilot and diagnostic queries"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: secretnests-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run check

      - name: Resolve Cloudflare account from API token
        id: account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          WHOAMI="$(npx wrangler whoami --json)"
          echo "$WHOAMI" | jq -e '.loggedIn == true' >/dev/null
          ACCOUNT_COUNT="$(echo "$WHOAMI" | jq '.accounts | length')"
          if [ "$ACCOUNT_COUNT" -ne 1 ]; then
            echo "::error::Cloudflare API token must resolve to exactly one scoped account; found $ACCOUNT_COUNT."
            echo "$WHOAMI" | jq '{loggedIn,authType,accounts:[.accounts[]|{name}]}'
            exit 1
          fi
          ACCOUNT_ID="$(echo "$WHOAMI" | jq -r '.accounts[0].id')"
          ACCOUNT_NAME="$(echo "$WHOAMI" | jq -r '.accounts[0].name')"
          test -n "$ACCOUNT_ID"
          test "$ACCOUNT_ID" != "null"
          echo "Resolved Cloudflare account: $ACCOUNT_NAME"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(curl --connect-timeout 5 --max-time 30 -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          DB_ID="$(echo "$LIST" | jq -r '.result[] | select(.name=="secretnests") | .uuid' | head -n1)"
          test -n "$DB_ID"
          test "$DB_ID" != "null"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          sed -i -E 's/database_id = "[^"]+"/database_id = "'"$DB_ID"'"/' wrangler.toml

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply secretnests --remote

      - name: Verify market-intelligence schema
        run: |
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(*) AS mappings FROM hotel_provider_mappings; SELECT COUNT(*) AS evidence FROM hotel_external_evidence; SELECT COUNT(*) AS rate_runs FROM hotel_rate_sync_runs; SELECT COUNT(*) AS evidence_runs FROM hotel_evidence_sync_runs; SELECT COUNT(*) AS nuitee_audits FROM hotel_nuitee_audit; SELECT COUNT(*) AS provider_metadata FROM hotel_provider_metadata;" --yes

      - name: Content quality summary
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(*) published_hotels, SUM(CASE WHEN city IS NULL OR trim(city)='' THEN 1 ELSE 0 END) missing_city, SUM(CASE WHEN formatted_address IS NULL OR trim(formatted_address)='' THEN 1 ELSE 0 END) missing_address, SUM(CASE WHEN website IS NULL OR trim(website)='' THEN 1 ELSE 0 END) missing_website, SUM(CASE WHEN description IS NULL OR length(trim(description))<80 THEN 1 ELSE 0 END) missing_description, SUM(CASE WHEN amenities_json IS NULL OR amenities_json='[]' THEN 1 ELSE 0 END) missing_amenities, SUM(CASE WHEN brand_name IS NULL OR trim(brand_name)='' THEN 1 ELSE 0 END) missing_brand FROM hotels WHERE is_published=1;" --yes
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(DISTINCT hotel_id) hotels_with_publishable_media FROM media_assets WHERE rights_status IN ('owned_user_upload','hotel_authorized','licensed_api','licensed_public'); SELECT COUNT(DISTINCT hotel_id) hotels_with_recent_rates FROM hotel_rate_observations WHERE provider_id<>'nuitee_sandbox' AND observed_at>=datetime('now','-45 days'); SELECT COUNT(*) published_first_party_reviews FROM trip_reports tr JOIN stays s ON s.id=tr.stay_id WHERE tr.status='published' AND COALESCE(s.verification_method,'')<>'demo';" --yes
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(*) nuitee_audits, SUM(CASE WHEN mapping_status='mapped' AND mapping_confidence='high' THEN 1 ELSE 0 END) high_confidence_mapped, SUM(CASE WHEN metadata_status='complete' AND environment='production' THEN 1 ELSE 0 END) production_metadata_complete, SUM(CASE WHEN rate_audited_at IS NOT NULL THEN 1 ELSE 0 END) rate_audited FROM hotel_nuitee_audit;" --yes

      - name: Dry-run Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Prepare atomic deployment secrets
        id: pilot
        shell: bash
        env:
          NUITEE_API_KEY: ${{ secrets.NUITEE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          BOOKING_DEMAND_API_TOKEN: ${{ secrets.BOOKING_DEMAND_API_TOKEN }}
          BOOKING_DEMAND_AFFILIATE_ID: ${{ secrets.BOOKING_DEMAND_AFFILIATE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTH0_LOGIN_DOMAIN: ${{ secrets.AUTH0_LOGIN_DOMAIN }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg activation "$TOKEN" \
            --arg nuitee "$NUITEE_API_KEY" \
            --arg serpapi "$SERPAPI_API_KEY" \
            --arg booking_token "$BOOKING_DEMAND_API_TOKEN" \
            --arg booking_affiliate "$BOOKING_DEMAND_AFFILIATE_ID" \
            --arg openai "$OPENAI_API_KEY" \
            --arg auth0_login_domain "$AUTH0_LOGIN_DOMAIN" \
            --arg auth0_domain "$AUTH0_DOMAIN" \
            --arg auth0_client_id "$AUTH0_CLIENT_ID" \
            --arg auth0_client_secret "$AUTH0_CLIENT_SECRET" \
            '{
              PRODUCTION_ACTIVATION_TOKEN: $activation
            }
            + (if $nuitee != "" then {NUITEE_API_KEY:$nuitee} else {} end)
            + (if $serpapi != "" then {SERPAPI_API_KEY:$serpapi} else {} end)
            + (if $booking_token != "" then {BOOKING_DEMAND_API_TOKEN:$booking_token} else {} end)
            + (if $booking_affiliate != "" then {BOOKING_DEMAND_AFFILIATE_ID:$booking_affiliate} else {} end)
            + (if $openai != "" then {OPENAI_API_KEY:$openai} else {} end)
            + (if $auth0_login_domain != "" then {AUTH0_LOGIN_DOMAIN:$auth0_login_domain} else {} end)
            + (if $auth0_domain != "" then {AUTH0_DOMAIN:$auth0_domain} else {} end)
            + (if $auth0_client_id != "" then {AUTH0_CLIENT_ID:$auth0_client_id} else {} end)
            + (if $auth0_client_secret != "" then {AUTH0_CLIENT_SECRET:$auth0_client_secret} else {} end)' \
            > /tmp/secretnests-secrets.json
          chmod 600 /tmp/secretnests-secrets.json

          configured=0
          [ -n "$NUITEE_API_KEY" ] && configured=$((configured+1)) || true
          [ -n "$SERPAPI_API_KEY" ] && configured=$((configured+1)) || true
          [ -n "$BOOKING_DEMAND_API_TOKEN" ] && configured=$((configured+1)) || true
          [ -n "$BOOKING_DEMAND_AFFILIATE_ID" ] && configured=$((configured+1)) || true
          [ -n "$OPENAI_API_KEY" ] && configured=$((configured+1)) || true
          [ -n "$AUTH0_LOGIN_DOMAIN" ] && configured=$((configured+1)) || true
          [ -n "$AUTH0_DOMAIN" ] && configured=$((configured+1)) || true
          [ -n "$AUTH0_CLIENT_ID" ] && configured=$((configured+1)) || true
          [ -n "$AUTH0_CLIENT_SECRET" ] && configured=$((configured+1)) || true
          if [ -n "$NUITEE_API_KEY" ]; then
            case "$NUITEE_API_KEY" in
              prod_*) echo "Nuitee production key detected." ;;
              sand_*) echo "Nuitee sandbox key detected." ;;
              *) echo "::error::NUITEE_API_KEY has an unrecognized prefix."; exit 1 ;;
            esac
          fi
          echo "Prepared activation token plus $configured configured optional provider secret(s) for one atomic deploy."

      - name: Deploy Worker with secrets
        run: npx wrangler deploy --secrets-file /tmp/secretnests-secrets.json

      - name: Verify deployed secret names
        run: npx wrangler secret list || true

      - name: Start production Nuitee hotel enrichment
        shell: bash
        env:
          WARMUP_TOKEN: ${{ steps.pilot.outputs.token }}
          NUITEE_API_KEY: ${{ secrets.NUITEE_API_KEY }}
        run: |
          set -euo pipefail
          case "$NUITEE_API_KEY" in
            prod_*) ;;
            *) echo "Production Nuitee key not configured; skipping production warmup."; exit 0 ;;
          esac
          HTTP_CODE=""
          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl --connect-timeout 5 --max-time 150 -sS -o /tmp/nuitee-warmup.json -w '%{http_code}' -X POST               -H "Authorization: Bearer $WARMUP_TOKEN"               https://secretnests.com/api/internal/nuitee/static-warmup || true)"
            if [ "$HTTP_CODE" = "200" ]; then break; fi
            echo "Nuitee warmup returned HTTP $HTTP_CODE; waiting for Worker propagation (attempt $attempt/6)."
            sleep 3
          done
          test "$HTTP_CODE" = "200"
          jq . /tmp/nuitee-warmup.json
          jq -e '.ok == true' /tmp/nuitee-warmup.json

      - name: Post-enrichment content snapshot
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(*) published_hotels, SUM(CASE WHEN city IS NULL OR trim(city)='' THEN 1 ELSE 0 END) missing_city, SUM(CASE WHEN formatted_address IS NULL OR trim(formatted_address)='' THEN 1 ELSE 0 END) missing_address, SUM(CASE WHEN amenities_json IS NULL OR amenities_json='[]' THEN 1 ELSE 0 END) missing_amenities, SUM(CASE WHEN brand_name IS NULL OR trim(brand_name)='' THEN 1 ELSE 0 END) missing_brand FROM hotels WHERE is_published=1; SELECT COUNT(DISTINCT hotel_id) hotels_with_publishable_media FROM media_assets WHERE rights_status IN ('owned_user_upload','hotel_authorized','licensed_api','licensed_public'); SELECT COUNT(*) production_metadata_complete FROM hotel_nuitee_audit WHERE metadata_status='complete' AND environment='production';" --yes

      - name: Verify favicon assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in favicon.png favicon.ico apple-touch-icon.png; do
            code="$(curl --connect-timeout 3 --max-time 10 -sS -o "/tmp/$asset" -w '%{http_code}' "https://secretnests.com/$asset?v=4")"
            test "$code" = "200"
            test -s "/tmp/$asset"
          done

      - name: Production SEO smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/ -o /tmp/seo-home.html
          grep -Fq '<title>Luxury Hotel Reviews, Prices &amp; Value | SecretNests</title>' /tmp/seo-home.html
          grep -Fq 'SecretNests is a luxury hotel review and value database.' /tmp/seo-home.html
          grep -Fq '"@type":"WebSite"' /tmp/seo-home.html
          grep -Fq 'max-image-preview:large' /tmp/seo-home.html
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/robots.txt -o /tmp/robots.txt
          grep -Fq 'User-agent: OAI-SearchBot' /tmp/robots.txt
          grep -Fq 'Sitemap: https://secretnests.com/sitemap.xml' /tmp/robots.txt
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/llms.txt -o /tmp/llms.txt
          grep -Fq 'independent luxury hotel review and value database' /tmp/llms.txt
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/sitemap.xml -o /tmp/sitemap.xml
          grep -Fq 'https://secretnests.com/hotel/hotel-indigo-grand-cayman' /tmp/sitemap.xml
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/hotel/hotel-indigo-grand-cayman -o /tmp/seo-hotel.html
          grep -Fq '<link rel="canonical" href="https://secretnests.com/hotel/hotel-indigo-grand-cayman">' /tmp/seo-hotel.html
          grep -Fq '"@type":"Hotel"' /tmp/seo-hotel.html
          if grep -Fq '"aggregateRating"' /tmp/seo-hotel.html; then echo "::error::Hotel schema must not aggregate third-party ratings."; exit 1; fi
          code="$(curl --connect-timeout 5 --max-time 20 -sS -o /dev/null -w '%{http_code}' https://secretnests.com/boutique-hotels)"
          test "$code" = "301"

      - name: Production smoke test
        shell: bash
        env:
          AUTH0_LOGIN_DOMAIN: ${{ secrets.AUTH0_LOGIN_DOMAIN }}
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 20 -fsS https://secretnests.com/health | jq -e '.ok == true'
          ROUTES=( "/" "/brands" "/contribute" "/compare" "/add-your-trip" )
          for route in "${ROUTES[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              code="$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/smoke.html -w '%{http_code}' "https://secretnests.com$route" || true)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "Smoke route $route returned HTTP $code; waiting for Worker route propagation (attempt $attempt/8)."
              sleep 2
            done
            test "$ok" = "1"
          done

          test -n "$AUTH0_LOGIN_DOMAIN"
          curl --connect-timeout 5 --max-time 20 -sS -D /tmp/sn-auth.headers -o /dev/null \
            'https://secretnests.com/login?return_to=%2Fadd-your-trip'
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/sn-auth.headers
          AUTH_LOCATION="$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,"");sub(/\r$/,"");print;exit}' /tmp/sn-auth.headers)"
          test -n "$AUTH_LOCATION"
          case "$AUTH_LOCATION" in
            "https://$AUTH0_LOGIN_DOMAIN/authorize"*) ;;
            *) echo "::error::SecretNests login did not redirect to the configured Auth0 authorize endpoint."; cat /tmp/sn-auth.headers; exit 1 ;;
          esac

          curl --connect-timeout 5 --max-time 20 -sS -D /tmp/auth0-google.headers -o /tmp/auth0-google.body "$AUTH_LOCATION"
          AUTH0_STATUS="$(awk 'NR==1{print $2}' /tmp/auth0-google.headers)"
          GOOGLE_LOCATION="$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,"");sub(/\r$/,"");print;exit}' /tmp/auth0-google.headers)"
          if [ "$AUTH0_STATUS" = "302" ] || [ "$AUTH0_STATUS" = "303" ]; then
            echo "$GOOGLE_LOCATION" | grep -Eq '^https://accounts\.google\.com/'
          else
            echo "::error::Auth0 Google connection did not redirect to Google. HTTP $AUTH0_STATUS"
            head -c 1000 /tmp/auth0-google.body || true
            exit 1
          fi

          GOOGLE_STATUS="$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/google-auth.body -w '%{http_code}' "$GOOGLE_LOCATION" || true)"
          if [ "$GOOGLE_STATUS" = "400" ] || grep -Eqi 'redirect_uri_mismatch|Error 400' /tmp/google-auth.body; then
            echo "::error::Google rejected the Auth0 callback/redirect URI configuration."
            head -c 1500 /tmp/google-auth.body || true
            exit 1
          fi
          case "$GOOGLE_STATUS" in
            200|302|303) ;;
            *) echo "::error::Google OAuth endpoint returned unexpected HTTP $GOOGLE_STATUS"; exit 1 ;;
          esac

      - name: Run bounded market-intelligence pilot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_market_pilot }}
        id: pilot_run
        shell: bash
        env:
          PILOT_TOKEN: ${{ steps.pilot.outputs.token }}
        run: |
          set -euo pipefail
          HTTP_CODE=""
          for attempt in 1 2 3 4 5 6 7 8; do
            HTTP_CODE="$(curl --connect-timeout 5 --max-time 120 -sS -o /tmp/pilot.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $PILOT_TOKEN" \
              https://secretnests.com/api/internal/market-intelligence/pilot || true)"
            if [ "$HTTP_CODE" = "200" ]; then break; fi
            echo "Pilot endpoint returned HTTP $HTTP_CODE; waiting for Worker secret propagation (attempt $attempt/8)."
            sleep 2
          done
          test "$HTTP_CODE" = "200"
          RESULT="$(cat /tmp/pilot.json)"
          echo "$RESULT" | jq .
          echo "$RESULT" | jq -e '.ok == true'
          echo "result=$(echo "$RESULT" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Inspect pilot quality
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_market_pilot }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Market-data provider mappings ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT h.name,m.provider_hotel_id,m.confidence,json_extract(m.metadata_json,'$.matched_name') AS matched_name,ROUND(CAST(json_extract(m.metadata_json,'$.distance_km') AS REAL),3) AS distance_km FROM hotel_provider_mappings m JOIN hotels h ON h.id=m.hotel_id WHERE m.provider IN ('nuitee_connect','serpapi_google_hotels','booking_demand') ORDER BY m.updated_at DESC LIMIT 10;" --yes
          echo "=== Recent live rates ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT h.name,ROUND(r.nightly_rate,2) AS nightly_rate,r.currency,r.checkin_date,r.checkout_date,r.room_type,r.taxes_fees_included,r.observed_at FROM hotel_rate_observations r JOIN hotels h ON h.id=r.hotel_id WHERE r.provider_id IN ('nuitee_connect','nuitee_sandbox','serpapi_google_hotels','booking_demand') ORDER BY r.observed_at DESC LIMIT 20;" --yes
          echo "=== Recent external evidence ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT h.name,e.source_domain,e.sentiment,e.confidence,substr(e.summary,1,180) AS summary,e.observed_at FROM hotel_external_evidence e JOIN hotels h ON h.id=e.hotel_id ORDER BY e.observed_at DESC LIMIT 20;" --yes
          echo "=== Nuitee top-250 audit ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(*) AS audited,SUM(CASE WHEN mapping_status IN ('mapped','review') THEN 1 ELSE 0 END) AS mapped,SUM(CASE WHEN mapping_confidence='high' THEN 1 ELSE 0 END) AS high_confidence,SUM(CASE WHEN mapping_status='review' THEN 1 ELSE 0 END) AS needs_review,SUM(CASE WHEN metadata_status='complete' THEN 1 ELSE 0 END) AS metadata_complete,SUM(CASE WHEN review_status='complete' THEN 1 ELSE 0 END) AS reviews_available,SUM(CASE WHEN rate_audited_at IS NOT NULL THEN 1 ELSE 0 END) AS rate_audited,SUM(CASE WHEN canonical_status='complete' THEN 1 ELSE 0 END) AS canonical_complete,SUM(CASE WHEN canonical_status='complete' AND canonical_fields>0 THEN 1 ELSE 0 END) AS canonical_updated,ROUND(AVG(CASE WHEN rate_audited_at IS NOT NULL THEN rate_coverage_pct END),1) AS avg_rate_coverage FROM hotel_nuitee_audit;" --yes
          echo "=== Canonical Nuitee promotion sample ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT h.name,a.canonical_fields,length(COALESCE(h.amenities_json,'[]')) AS amenities_bytes,h.city,h.country,h.hotel_category,h.external_review_source FROM hotel_nuitee_audit a JOIN hotels h ON h.id=a.hotel_id WHERE a.canonical_status='complete' AND a.canonical_fields>0 ORDER BY a.canonical_at DESC LIMIT 15;" --yes
          echo "=== SEO/distribution surfaces ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT COUNT(*) AS branded_hotels,COUNT(DISTINCT brand_name) AS brands FROM hotels WHERE brand_name IS NOT NULL AND trim(brand_name)<>''; SELECT code,channel,target_count,status FROM contribution_campaigns ORDER BY created_at; SELECT COUNT(*) AS attributed_submissions FROM trip_submissions WHERE contribution_source IS NOT NULL OR contribution_campaign IS NOT NULL;" --yes
          echo "=== Nuitee audit errors ==="
          npx wrangler d1 execute secretnests --remote --command="SELECT p.priority_rank,h.name,a.mapping_status,a.mapping_confidence,a.mapping_stage,a.metadata_status,a.review_status,a.mapping_error,a.metadata_error,a.review_error,a.candidate_name,ROUND(a.candidate_similarity,3) AS candidate_similarity,ROUND(a.candidate_distance_km,2) AS candidate_distance_km FROM hotel_nuitee_audit a JOIN hotels h ON h.id=a.hotel_id JOIN hotel_enrichment_profiles p ON p.hotel_id=a.hotel_id WHERE a.mapping_error IS NOT NULL OR a.metadata_error IS NOT NULL OR a.review_error IS NOT NULL OR a.mapping_status IN ('failed','review') OR a.metadata_status='failed' OR a.review_status='failed' ORDER BY p.priority_rank LIMIT 40;" --yes

      - name: Release summary
        if: always()
        run: |
          echo "D1 database: secretnests"
          echo "Worker: secretnests"
          echo "Market intelligence pilot: manual opt-in only"
