name: SecretNests CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

      - name: Prepare local Wrangler config
        run: |
          cp wrangler.toml wrangler.ci.toml
          sed -i 's/REPLACE_WITH_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/g' wrangler.ci.toml

      - name: Build local seed files
        run: |
          node scripts/build-legacy-hotel-seed.mjs
          node scripts/build-reddit-evidence-seed.mjs
          node scripts/build-demo-seed.mjs

      - name: Build local D1
        run: |
          npx wrangler d1 migrations apply secretnests --local --config wrangler.ci.toml
          npx wrangler d1 execute secretnests --local --config wrangler.ci.toml --file=.generated/legacy-hotels.sql
          npx wrangler d1 execute secretnests --local --config wrangler.ci.toml --file=.generated/reddit-evidence.sql
          npx wrangler d1 execute secretnests --local --config wrangler.ci.toml --file=.generated/demo.sql

      - name: Smoke-test Cloudflare Worker routes
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          set -x
          curl() { command curl --connect-timeout 3 --max-time 15 "$@"; }
          timeout --signal=TERM 180s npx wrangler dev --local --config wrangler.ci.toml --port 8787 > /tmp/secretnests-worker.log 2>&1 &
          PID=$!
          trap 'kill $PID || true; cat /tmp/secretnests-worker.log' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8787/health | jq -e '.ok == true'
          curl -fsS http://127.0.0.1:8787/ >/dev/null
          curl -fsS 'http://127.0.0.1:8787/search?q=hotel' >/dev/null
          curl -fsS 'http://127.0.0.1:8787/search?q=%27%20OR%201%3D1--' >/dev/null
          curl -fsS http://127.0.0.1:8787/destinations >/dev/null
          curl -fsS http://127.0.0.1:8787/creators >/dev/null
          curl -fsS http://127.0.0.1:8787/@rebecca >/dev/null
          curl -fsS http://127.0.0.1:8787/@rebecca/lists/hotels-id-pay-500-for-again >/dev/null
          curl -fsS http://127.0.0.1:8787/value >/dev/null
          curl -fsS http://127.0.0.1:8787/value/under-500 >/dev/null
          curl -fsS http://127.0.0.1:8787/add-your-trip >/dev/null
          curl -fsS http://127.0.0.1:8787/privacy >/dev/null
          curl -fsS http://127.0.0.1:8787/terms >/dev/null
          curl -fsS http://127.0.0.1:8787/disclosures >/dev/null
          curl -fsS http://127.0.0.1:8787/sitemap.xml >/dev/null
          curl -fsS http://127.0.0.1:8787/robots.txt >/dev/null
          curl -fsS http://127.0.0.1:8787/llms.txt >/dev/null

          SLUG="$(curl -fsS 'http://127.0.0.1:8787/api/hotels?limit=1' | jq -r '.[0].slug')"
          test -n "$SLUG"
          test "$SLUG" != "null"
          HOTEL_HTML="$(curl -fsS "http://127.0.0.1:8787/hotel/$SLUG")"
          echo "$HOTEL_HTML" | grep -q '"@type":"Hotel"'
          echo "$HOTEL_HTML" | grep -q '<link rel="canonical"'
          curl -fsS http://127.0.0.1:8787/compare/fairmont-banff-springs-vs-bawah-reserve >/dev/null

          curl -fsS http://127.0.0.1:8787/destinations/canada/banff >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/destination/legacy?city=Banff&country=Canada')" = "301"

          curl -fsS -X POST http://127.0.0.1:8787/api/events             -H 'content-type: application/json'             --data '{"name":"page_view","path":"/ci"}'             | jq -e '.ok == true'

          curl -fsS 'http://127.0.0.1:8787/api/hotel-suggest?q=Fairmont' | jq -e '.ok == true and (.hotels|length) > 0'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/add-your-trip             -F 'hotel_name=Fairmont Banff Springs'             -F 'paid_nightly_rate=700'             -F 'would_pay_again=650'             -F 'would_return=1')" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/admin/submissions)" = "404"
